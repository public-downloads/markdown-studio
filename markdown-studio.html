<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown Studio</title>
<style>
/* ============================================================
   THEME TOKENS
   Change these to restyle the whole app.
   ============================================================ */
:root{
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "Cascadia Code", "JetBrains Mono", Consolas, "SF Mono", monospace;
  --radius: 8px;
  --sidebar-w: 230px;
}
[data-theme="dark"]{
  --bg:#15171c; --bg-2:#1b1e25; --bg-3:#232733; --bg-hover:#2b3040;
  --fg:#dfe3ec; --fg-dim:#98a0b3; --fg-faint:#646c7e;
  --border:#2c313d; --accent:#6aa9ff; --accent-dim:#3a5f96;
  --accent-soft:rgba(106,169,255,.14);
  --code-bg:#11131a; --warn:#ffb454; --ok:#7fd88f;
}
[data-theme="light"]{
  --bg:#ffffff; --bg-2:#f6f7f9; --bg-3:#eceef2; --bg-hover:#e2e5eb;
  --fg:#1f2430; --fg-dim:#5a6273; --fg-faint:#8d94a3;
  --border:#dcdfe6; --accent:#1a6fd4; --accent-dim:#94bdf0;
  --accent-soft:rgba(26,111,212,.10);
  --code-bg:#f2f3f6; --warn:#b26a00; --ok:#2f7d43;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:var(--font-ui); background:var(--bg); color:var(--fg);
  display:flex; flex-direction:column; overflow:hidden;
  font-size:14px;
}

/* ============================================================ TOOLBAR */
#toolbar{
  display:flex; align-items:center; gap:2px; flex-wrap:wrap;
  padding:6px 8px; background:var(--bg-2);
  border-bottom:1px solid var(--border); flex:0 0 auto;
}
.tb-group{display:flex; align-items:center; gap:2px}
.tb-sep{width:1px; height:20px; background:var(--border); margin:0 6px}
.tb-spacer{flex:1}
button.tb{
  background:transparent; border:1px solid transparent; color:var(--fg-dim);
  height:30px; min-width:30px; padding:0 8px; border-radius:6px;
  cursor:pointer; font-size:13px; font-family:var(--font-ui);
  display:inline-flex; align-items:center; justify-content:center; gap:5px;
  white-space:nowrap;
}
button.tb:hover{background:var(--bg-hover); color:var(--fg)}
button.tb:active{transform:translateY(1px)}
button.tb.on{background:var(--accent-soft); color:var(--accent); border-color:var(--accent-dim)}
button.tb.primary{color:var(--fg)}
button.tb b{font-weight:700}
button.tb i{font-style:italic}
button.tb s{text-decoration:line-through}
.doc-name{
  font-size:13px; color:var(--fg-dim); padding:0 10px;
  max-width:340px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.doc-name .dirty{color:var(--warn)}

/* ============================================================ LAYOUT */
#main{flex:1; display:flex; min-height:0}
#outline{
  width:var(--sidebar-w); flex:0 0 var(--sidebar-w);
  background:var(--bg-2); border-right:1px solid var(--border);
  overflow-y:auto; padding:10px 0; font-size:13px;
}
#outline.hidden{display:none}
#outline .ol-title{
  padding:4px 14px 10px; color:var(--fg-faint); font-size:11px;
  text-transform:uppercase; letter-spacing:.08em;
}
#outline a{
  display:block; padding:4px 14px; color:var(--fg-dim);
  text-decoration:none; cursor:pointer; border-left:2px solid transparent;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
#outline a:hover{background:var(--bg-hover); color:var(--fg)}
#outline a.lv1{padding-left:14px; font-weight:600; color:var(--fg)}
#outline a.lv2{padding-left:26px}
#outline a.lv3{padding-left:38px}
#outline a.lv4{padding-left:50px; font-size:12px}
#outline a.lv5,#outline a.lv6{padding-left:62px; font-size:12px}
#outline .empty{padding:6px 14px; color:var(--fg-faint); font-style:italic}

#panes{flex:1; display:flex; min-width:0; min-height:0}
.pane{flex:1; min-width:0; overflow-y:auto; position:relative}
.pane.hidden{display:none}
#sourcePane{border-right:1px solid var(--border)}
body[data-mode="source"] #sourcePane{border-right:none}

#source{
  width:100%; height:100%; border:0; outline:0; resize:none;
  background:var(--bg); color:var(--fg);
  font-family:var(--font-mono); font-size:13.5px; line-height:1.65;
  padding:24px 28px; tab-size:2;
}

/* ============================================================ DOCUMENT STYLES
   Shared by the WYSIWYG editor and the read-only preview. */
.doc{
  padding:28px 36px 120px; max-width:900px; margin:0 auto;
  line-height:1.7; outline:none;
}
.doc:focus{outline:none}
.doc h1,.doc h2,.doc h3,.doc h4,.doc h5,.doc h6{
  line-height:1.3; margin:1.6em 0 .6em; font-weight:650;
}
.doc h1{font-size:1.9em; margin-top:.2em; border-bottom:1px solid var(--border); padding-bottom:.3em}
.doc h2{font-size:1.5em; border-bottom:1px solid var(--border); padding-bottom:.25em}
.doc h3{font-size:1.25em}
.doc h4{font-size:1.08em}
.doc h5,.doc h6{font-size:1em; color:var(--fg-dim)}
.doc p{margin:.85em 0}
.doc a{color:var(--accent); text-decoration:none}
.doc a:hover{text-decoration:underline}
.doc code{
  font-family:var(--font-mono); font-size:.88em; background:var(--code-bg);
  padding:.15em .4em; border-radius:4px; border:1px solid var(--border);
}
.doc pre{
  background:var(--code-bg); border:1px solid var(--border);
  border-radius:var(--radius); padding:14px 16px; overflow-x:auto; margin:1em 0;
}
.doc pre code{background:none; border:0; padding:0; font-size:.88em; line-height:1.55}
.doc blockquote{
  margin:1em 0; padding:.3em 1em; border-left:3px solid var(--accent-dim);
  color:var(--fg-dim); background:var(--accent-soft); border-radius:0 6px 6px 0;
}
.doc blockquote p{margin:.5em 0}
.doc ul,.doc ol{margin:.8em 0; padding-left:1.6em}
.doc li{margin:.3em 0}
.doc li>ul,.doc li>ol{margin:.3em 0}
.doc hr{border:0; border-top:1px solid var(--border); margin:2em 0}
.doc img{max-width:100%; border-radius:6px}
.doc table{border-collapse:collapse; margin:1.1em 0; width:100%; font-size:.95em}
.doc th,.doc td{border:1px solid var(--border); padding:7px 11px; text-align:left}
.doc th{background:var(--bg-3); font-weight:650}
.doc tbody tr:nth-child(even){background:var(--bg-2)}
.doc table.sel{outline:2px solid var(--accent-dim); outline-offset:1px}
.doc .task{list-style:none; margin-left:-1.3em}
.doc .task input{margin-right:.55em; vertical-align:middle; cursor:pointer}
.doc>*:first-child{margin-top:0}

/* ============================================================ TABLE CONTROLS */
#tableBar{
  position:fixed; z-index:40; display:none; gap:2px; padding:4px;
  background:var(--bg-3); border:1px solid var(--border);
  border-radius:7px; box-shadow:0 6px 20px rgba(0,0,0,.35);
}
#tableBar.show{display:flex}
#tableBar button{
  background:transparent;border:0;color:var(--fg-dim);cursor:pointer;
  font-size:12px;padding:4px 7px;border-radius:5px;font-family:var(--font-ui);
}
#tableBar button:hover{background:var(--bg-hover);color:var(--fg)}
#tableBar button.danger:hover{background:#b3384522;color:#ff8b96}

/* ============================================================ STATUS BAR */
#status{
  flex:0 0 auto; display:flex; align-items:center; gap:16px;
  padding:5px 12px; background:var(--bg-2); border-top:1px solid var(--border);
  font-size:12px; color:var(--fg-faint);
}
#status .right{margin-left:auto; display:flex; gap:14px}
#status kbd{
  background:var(--bg-3); border:1px solid var(--border); border-bottom-width:2px;
  border-radius:4px; padding:1px 5px; font-family:var(--font-mono); font-size:11px;
}

/* ============================================================ DIALOGS */
dialog{
  border:1px solid var(--border); background:var(--bg-2); color:var(--fg);
  border-radius:12px; padding:0; box-shadow:0 20px 60px rgba(0,0,0,.5);
  max-width:min(94vw,620px);
}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dlg-head{padding:16px 20px 8px; font-size:15px; font-weight:600}
.dlg-body{padding:6px 20px 16px}
.dlg-foot{
  padding:12px 20px 16px; display:flex; gap:8px; justify-content:flex-end;
  border-top:1px solid var(--border); margin-top:8px;
}
.dlg-body label{display:block; margin:12px 0 5px; color:var(--fg-dim); font-size:12.5px}
.dlg-body input[type=text],.dlg-body input[type=number],.dlg-body select,.dlg-body textarea{
  width:100%; background:var(--bg); color:var(--fg); border:1px solid var(--border);
  border-radius:6px; padding:8px 10px; font-family:var(--font-ui); font-size:13.5px; outline:none;
}
.dlg-body input:focus,.dlg-body select:focus,.dlg-body textarea:focus{border-color:var(--accent)}
.row{display:flex; gap:12px}
.row>div{flex:1}
button.btn{
  background:var(--bg-3); color:var(--fg); border:1px solid var(--border);
  padding:8px 16px; border-radius:7px; cursor:pointer; font-size:13.5px; font-family:var(--font-ui);
}
button.btn:hover{background:var(--bg-hover)}
button.btn.go{background:var(--accent); border-color:var(--accent); color:#fff}
button.btn.go:hover{filter:brightness(1.1)}
#gridWrap{overflow:auto; max-height:46vh; margin-top:12px}
#gridWrap table{border-collapse:collapse}
#gridWrap td{border:1px solid var(--border); padding:0}
#gridWrap input{
  border:0; background:transparent; color:var(--fg); padding:6px 8px;
  width:130px; font-family:var(--font-ui); font-size:13px; outline:none;
}
#gridWrap input:focus{background:var(--accent-soft)}
#gridWrap tr:first-child input{font-weight:650}
.hint{color:var(--fg-faint); font-size:12px; margin-top:10px; line-height:1.5}

/* ============================================================ TOAST */
#toast{
  position:fixed; bottom:38px; left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--bg-3); border:1px solid var(--border); color:var(--fg);
  padding:9px 18px; border-radius:8px; font-size:13px; opacity:0;
  pointer-events:none; transition:opacity .18s, transform .18s; z-index:100;
  box-shadow:0 8px 30px rgba(0,0,0,.4);
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

@media (max-width:820px){
  #outline{display:none}
  body[data-mode="split"] #previewPane{display:none}
}
</style>
</head>
<body data-mode="wysiwyg">

<header id="toolbar">
  <div class="tb-group" id="fileGroup"></div>
  <div class="tb-sep"></div>
  <div class="tb-group" id="formatGroup"></div>
  <div class="tb-sep"></div>
  <div class="tb-group" id="blockGroup"></div>
  <div class="tb-sep"></div>
  <div class="tb-group" id="insertGroup"></div>
  <div class="tb-spacer"></div>
  <span class="doc-name" id="docName">Untitled.md</span>
  <div class="tb-group" id="viewGroup"></div>
</header>

<div id="main">
  <aside id="outline"><div class="ol-title">Outline</div><div id="outlineList"></div></aside>
  <div id="panes">
    <div class="pane hidden" id="sourcePane"><textarea id="source" spellcheck="false" placeholder="# Start writing…"></textarea></div>
    <div class="pane" id="wysiwygPane"><div class="doc" id="wysiwyg" contenteditable="true" spellcheck="true"></div></div>
    <div class="pane hidden" id="previewPane"><div class="doc" id="preview"></div></div>
  </div>
</div>

<footer id="status">
  <span id="modeLabel">WYSIWYG</span>
  <span class="right">
    <span id="counts">0 words</span>
    <span><kbd>Ctrl</kbd>+<kbd>S</kbd> save · <kbd>Ctrl</kbd>+<kbd>O</kbd> open · <kbd>F1</kbd> shortcuts</span>
  </span>
</footer>

<div id="tableBar">
  <button data-t="rowAbove">↑ Row</button>
  <button data-t="rowBelow">↓ Row</button>
  <button data-t="colLeft">← Col</button>
  <button data-t="colRight">→ Col</button>
  <button data-t="delRow" class="danger">⌫ Row</button>
  <button data-t="delCol" class="danger">⌫ Col</button>
</div>

<dialog id="linkDlg">
  <form method="dialog">
    <div class="dlg-head">Insert link</div>
    <div class="dlg-body">
      <label>Text</label><input type="text" id="linkText">
      <label>URL</label><input type="text" id="linkUrl" placeholder="https://">
    </div>
    <div class="dlg-foot">
      <button class="btn" value="cancel">Cancel</button>
      <button class="btn go" value="ok" id="linkOk">Insert</button>
    </div>
  </form>
</dialog>

<dialog id="imgDlg">
  <form method="dialog">
    <div class="dlg-head">Insert image</div>
    <div class="dlg-body">
      <label>Alt text</label><input type="text" id="imgAlt">
      <label>Image URL or path</label><input type="text" id="imgUrl" placeholder="https:// or ./image.png">
    </div>
    <div class="dlg-foot">
      <button class="btn" value="cancel">Cancel</button>
      <button class="btn go" value="ok">Insert</button>
    </div>
  </form>
</dialog>

<dialog id="tableDlg">
  <div class="dlg-head">Table</div>
  <div class="dlg-body">
    <div class="row">
      <div><label>Rows (excl. header)</label><input type="number" id="tRows" min="1" max="60" value="3"></div>
      <div><label>Columns</label><input type="number" id="tCols" min="1" max="14" value="3"></div>
      <div><label>Align</label>
        <select id="tAlign"><option value="left">Left</option><option value="center">Center</option><option value="right">Right</option></select>
      </div>
    </div>
    <div id="gridWrap"></div>
    <div class="hint">Fill cells in directly — Tab moves across, Enter moves down. Leave blank for an empty table.</div>
  </div>
  <div class="dlg-foot">
    <button class="btn" id="tCancel">Cancel</button>
    <button class="btn go" id="tInsert">Insert table</button>
  </div>
</dialog>

<dialog id="helpDlg">
  <div class="dlg-head">Keyboard shortcuts</div>
  <div class="dlg-body" id="helpBody"></div>
  <div class="dlg-foot"><button class="btn go" id="helpClose">Close</button></div>
</dialog>

<div id="toast"></div>

<script>
"use strict";
/* ================================================================
   MARKDOWN STUDIO
   A single-file markdown editor. No dependencies, works offline.

   Architecture, in order down this file:
     1. MD          — markdown -> HTML
     2. Ser         — HTML/DOM -> markdown
     3. Doc         — document state, mode switching, sync
     4. Files       — open / save / export
     5. Commands    — the toolbar + hotkey registry  << ADD FEATURES HERE
     6. Tables      — insert dialog + live row/column editing
     7. UI          — wiring, outline, status bar

   To add a feature, append to the Commands array in section 5.
   Nothing else needs to change.
   ================================================================ */

/* ================================================================
   1. MARKDOWN -> HTML
   ================================================================ */
const MD = (() => {

  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const attr = s => String(s).replace(/"/g,'&quot;');

  function inline(text){
    let out = esc(text);

    // Protect code spans from all other processing.
    const spans = [];
    out = out.replace(/(`+)([\s\S]*?)\1/g, (m, ticks, code) => {
      spans.push(code.trim());
      return '\u0001' + (spans.length - 1) + '\u0001';
    });

    // Images before links (they share bracket syntax).
    out = out.replace(/!\[([^\]]*)\]\(\s*([^)\s]+)(?:\s+"([^"]*)")?\s*\)/g,
      (m, alt, src, title) => `<img src="${attr(src)}" alt="${attr(alt)}"${title ? ` title="${attr(title)}"` : ''}>`);

    out = out.replace(/\[([^\]]*)\]\(\s*([^)\s]+)(?:\s+"([^"]*)")?\s*\)/g,
      (m, txt, href, title) => `<a href="${attr(href)}"${title ? ` title="${attr(title)}"` : ''}>${txt}</a>`);

    // Bare URLs not already inside a tag.
    out = out.replace(/(^|[\s(])((?:https?:\/\/|www\.)[^\s<>()]+[^\s<>().,;:!?])/g,
      (m, pre, url) => `${pre}<a href="${attr(url.startsWith('www.') ? 'https://' + url : url)}">${url}</a>`);

    // Emphasis may wrap across lines within a block, so newlines are allowed
    // inside the run — block parsing has already split on blank lines.
    out = out.replace(/\*\*\*([^*]+)\*\*\*/g, '<strong><em>$1</em></strong>');
    out = out.replace(/___([^_]+)___/g, '<strong><em>$1</em></strong>');
    out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    out = out.replace(/__([^_]+)__/g, '<strong>$1</strong>');
    out = out.replace(/(^|[^\w*])\*([^*]+)\*/g, '$1<em>$2</em>');
    out = out.replace(/(^|[^\w_])_([^_]+)_/g, '$1<em>$2</em>');
    out = out.replace(/~~([^~]+)~~/g, '<del>$1</del>');

    // Hard line break: two trailing spaces.
    out = out.replace(/ {2,}\n/g, '<br>\n');

    return out.replace(/\u0001(\d+)\u0001/g, (m, i) => `<code>${spans[+i]}</code>`);
  }

  const RE_ITEM   = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
  const RE_HEAD   = /^(#{1,6})\s+(.*?)\s*#*\s*$/;
  const RE_HR     = /^\s*(?:-{3,}|\*{3,}|_{3,})\s*$/;
  const RE_FENCE  = /^\s*(```|~~~)(.*)$/;
  const RE_QUOTE  = /^\s*>\s?(.*)$/;
  const RE_DELIM  = /^\s*\|?\s*:?-{1,}:?\s*(\|\s*:?-{1,}:?\s*)*\|?\s*$/;

  function splitRow(line){
    let s = line.trim();
    if (s.startsWith('|')) s = s.slice(1);
    if (s.endsWith('|') && !s.endsWith('\\|')) s = s.slice(0, -1);
    const cells = []; let cur = '';
    for (let i = 0; i < s.length; i++){
      if (s[i] === '\\' && s[i+1] === '|'){ cur += '|'; i++; continue; }
      if (s[i] === '|'){ cells.push(cur.trim()); cur = ''; continue; }
      cur += s[i];
    }
    cells.push(cur.trim());
    return cells;
  }

  function parse(src){
    const lines = String(src).replace(/\r\n?/g, '\n').split('\n');
    return blocks(lines);
  }

  function blocks(lines){
    let html = '', i = 0;

    while (i < lines.length){
      const line = lines[i];

      if (!line.trim()){ i++; continue; }

      // --- fenced code ---
      let m = RE_FENCE.exec(line);
      if (m){
        const fence = m[1], lang = m[2].trim(), buf = [];
        i++;
        while (i < lines.length && !new RegExp('^\\s*' + fence).test(lines[i])){ buf.push(lines[i]); i++; }
        i++;
        html += `<pre${lang ? ` data-lang="${attr(lang)}"` : ''}><code>${esc(buf.join('\n'))}</code></pre>`;
        continue;
      }

      // --- heading ---
      if ((m = RE_HEAD.exec(line))){
        const lv = m[1].length;
        html += `<h${lv}>${inline(m[2])}</h${lv}>`;
        i++; continue;
      }

      // --- horizontal rule ---
      if (RE_HR.test(line) && !RE_ITEM.test(line)){ html += '<hr>'; i++; continue; }

      // --- table ---
      if (line.includes('|') && i + 1 < lines.length && RE_DELIM.test(lines[i+1]) && lines[i+1].includes('-')){
        const head = splitRow(line);
        const aligns = splitRow(lines[i+1]).map(c => {
          const l = c.startsWith(':'), r = c.endsWith(':');
          return l && r ? 'center' : r ? 'right' : l ? 'left' : '';
        });
        i += 2;
        const body = [];
        while (i < lines.length && lines[i].includes('|') && lines[i].trim()){ body.push(splitRow(lines[i])); i++; }
        const th = head.map((c, k) => `<th${aligns[k] ? ` style="text-align:${aligns[k]}"` : ''}>${inline(c)}</th>`).join('');
        const tb = body.map(r => '<tr>' + head.map((_, k) =>
          `<td${aligns[k] ? ` style="text-align:${aligns[k]}"` : ''}>${inline(r[k] || '')}</td>`).join('') + '</tr>').join('');
        html += `<table><thead><tr>${th}</tr></thead><tbody>${tb}</tbody></table>`;
        continue;
      }

      // --- blockquote ---
      if (RE_QUOTE.test(line)){
        const buf = [];
        while (i < lines.length && (RE_QUOTE.test(lines[i]) || (lines[i].trim() && !RE_ITEM.test(lines[i]) && !RE_HEAD.test(lines[i])))){
          const q = RE_QUOTE.exec(lines[i]);
          buf.push(q ? q[1] : lines[i]);
          i++;
        }
        html += `<blockquote>${blocks(buf)}</blockquote>`;
        continue;
      }

      // --- list ---
      if (RE_ITEM.test(line)){
        const r = list(lines, i);
        html += r.html; i = r.next; continue;
      }

      // --- paragraph ---
      const buf = [];
      while (i < lines.length && lines[i].trim() && !RE_HEAD.test(lines[i]) && !RE_ITEM.test(lines[i])
             && !RE_QUOTE.test(lines[i]) && !RE_FENCE.test(lines[i]) && !RE_HR.test(lines[i])
             && !(lines[i].includes('|') && i + 1 < lines.length && RE_DELIM.test(lines[i+1]))){
        buf.push(lines[i]); i++;
      }
      if (buf.length) html += `<p>${inline(buf.join('\n'))}</p>`;
      else i++;
    }
    return html;
  }

  function list(lines, start){
    const first = RE_ITEM.exec(lines[start]);
    const baseIndent = first[1].length;
    const ordered = /\d/.test(first[2]);
    const items = [];
    let i = start;

    while (i < lines.length){
      const m = RE_ITEM.exec(lines[i]);
      if (m && m[1].length <= baseIndent + 1){
        if (/\d/.test(m[2]) !== ordered) break;
        items.push([m[3]]);
        i++;
        // Gather continuation and nested lines.
        while (i < lines.length){
          if (!lines[i].trim()){
            // Blank line only continues the item if the next line is indented.
            const nxt = lines[i+1];
            if (nxt && /^\s+\S/.test(nxt) && (RE_ITEM.exec(nxt) || {})[1] !== undefined
                ? RE_ITEM.exec(nxt)[1].length > baseIndent
                : nxt && /^\s{2,}\S/.test(nxt)){
              items[items.length-1].push(''); i++; continue;
            }
            break;
          }
          const im = RE_ITEM.exec(lines[i]);
          if (im && im[1].length <= baseIndent + 1) break;
          if (/^\s{2,}/.test(lines[i]) || (!im && lines[i].trim())){
            items[items.length-1].push(lines[i].replace(new RegExp('^\\s{0,' + (baseIndent + 2) + '}'), ''));
            i++; continue;
          }
          break;
        }
      } else if (!lines[i].trim()){
        const nxt = lines[i+1];
        const nm = nxt ? RE_ITEM.exec(nxt) : null;
        if (nm && nm[1].length <= baseIndent + 1 && /\d/.test(nm[2]) === ordered){ i++; continue; }
        break;
      } else break;
    }

    const html = items.map(chunk => {
      let body = chunk.join('\n');
      let cls = '', box = '';
      const t = /^\[([ xX])\]\s+([\s\S]*)$/.exec(body);
      if (t){
        cls = ' class="task"';
        box = `<input type="checkbox"${/[xX]/.test(t[1]) ? ' checked' : ''}>`;
        body = t[2];
      }
      let inner = blocks(body.split('\n'));
      // Unwrap a lone paragraph so simple items stay on one line.
      const only = inner.match(/^<p>([\s\S]*)<\/p>$/);
      if (only && !/<p>/.test(only[1])) inner = only[1];
      return `<li${cls}>${box}${inner}</li>`;
    }).join('');

    return { html: `<${ordered ? 'ol' : 'ul'}>${html}</${ordered ? 'ol' : 'ul'}>`, next: i };
  }

  return { parse, inline };
})();


/* ================================================================
   2. HTML/DOM -> MARKDOWN
   ================================================================ */
const Ser = (() => {

  const BLOCK = new Set(['P','DIV','H1','H2','H3','H4','H5','H6','UL','OL','LI','PRE','BLOCKQUOTE','TABLE','HR','THEAD','TBODY','TR']);

  function escText(s){
    return s.replace(/([\\`*_{}\[\]#+\-!])/g, (m, c, off) => {
      // Only escape characters that could start markup at line start,
      // plus inline emphasis characters.
      if ('`*_[]'.includes(c)) return '\\' + c;
      return c;
    });
  }

  function inlineOf(node){
    let out = '';
    node.childNodes.forEach(n => {
      if (n.nodeType === 3){ out += n.nodeValue.replace(/\s+/g, ' '); return; }
      if (n.nodeType !== 1) return;
      const t = n.tagName, inner = inlineOf(n);
      switch (t){
        case 'STRONG': case 'B':
          out += inner.trim() ? `**${inner.trim()}**` : ''; break;
        case 'EM': case 'I':
          out += inner.trim() ? `*${inner.trim()}*` : ''; break;
        case 'DEL': case 'S': case 'STRIKE':
          out += inner.trim() ? `~~${inner.trim()}~~` : ''; break;
        case 'CODE':
          out += '`' + n.textContent + '`'; break;
        case 'A': {
          const href = n.getAttribute('href') || '';
          out += href ? `[${inner}](${href})` : inner; break;
        }
        case 'IMG':
          out += `![${n.getAttribute('alt') || ''}](${n.getAttribute('src') || ''})`; break;
        case 'BR':
          out += '  \n'; break;
        case 'INPUT':
          break; // task checkboxes handled by the LI branch
        default:
          out += inner;
      }
    });
    return out;
  }

  function blockOf(node, indent){
    indent = indent || '';
    let out = '';

    node.childNodes.forEach(n => {
      if (n.nodeType === 3){
        const t = n.nodeValue.trim();
        if (t) out += indent + t + '\n\n';
        return;
      }
      if (n.nodeType !== 1) return;
      const t = n.tagName;

      if (/^H[1-6]$/.test(t)){
        out += indent + '#'.repeat(+t[1]) + ' ' + inlineOf(n).trim() + '\n\n';

      } else if (t === 'P' || t === 'DIV'){
        // A DIV holding only block children is a wrapper, not a paragraph.
        const hasBlockKids = [...n.children].some(c => BLOCK.has(c.tagName));
        if (t === 'DIV' && hasBlockKids){ out += blockOf(n, indent); return; }
        const s = inlineOf(n).trim();
        if (s) out += indent + s + '\n\n';
        else if (t === 'DIV' && !n.textContent.trim() && n.querySelector('br')) out += '\n';

      } else if (t === 'PRE'){
        const lang = n.getAttribute('data-lang') || '';
        const code = (n.querySelector('code') || n).textContent.replace(/\n$/, '');
        out += indent + '```' + lang + '\n'
             + code.split('\n').map(l => indent + l).join('\n') + '\n'
             + indent + '```\n\n';

      } else if (t === 'BLOCKQUOTE'){
        const inner = blockOf(n, '').trim();
        out += inner.split('\n').map(l => indent + (l ? '> ' + l : '>')).join('\n') + '\n\n';

      } else if (t === 'UL' || t === 'OL'){
        out += listOf(n, indent) + '\n';

      } else if (t === 'HR'){
        out += indent + '---\n\n';

      } else if (t === 'TABLE'){
        out += tableOf(n, indent) + '\n';

      } else if (BLOCK.has(t)){
        out += blockOf(n, indent);

      } else {
        const s = inlineOf(n).trim();
        if (s) out += indent + s + '\n\n';
      }
    });

    return out;
  }

  function listOf(list, indent){
    const ordered = list.tagName === 'OL';
    let out = '', n = 1;
    [...list.children].forEach(li => {
      if (li.tagName !== 'LI') return;
      const marker = ordered ? (n++) + '.' : '-';
      const pad = ' '.repeat(marker.length + 1);

      const box = li.querySelector(':scope > input[type=checkbox]');
      const prefix = box ? `[${box.checked ? 'x' : ' '}] ` : '';

      // Split direct inline content from nested lists / blocks.
      const nested = [...li.children].filter(c => c.tagName === 'UL' || c.tagName === 'OL');
      const clone = li.cloneNode(true);
      [...clone.children].forEach(c => { if (c.tagName === 'UL' || c.tagName === 'OL') c.remove(); });

      let text = '';
      const blockKids = [...clone.children].filter(c => BLOCK.has(c.tagName));
      if (blockKids.length){
        text = blockOf(clone, '').trim().split('\n').map((l, k) => k ? indent + pad + l : l).join('\n');
      } else {
        text = inlineOf(clone).trim();
      }

      out += indent + marker + ' ' + prefix + text + '\n';
      nested.forEach(sub => { out += listOf(sub, indent + pad); });
    });
    return out;
  }

  function tableOf(table, indent){
    const rows = [...table.querySelectorAll('tr')];
    if (!rows.length) return '';
    const grid = rows.map(r => [...r.children].map(c => inlineOf(c).trim().replace(/\|/g, '\\|')));
    const cols = Math.max(...grid.map(r => r.length));
    grid.forEach(r => { while (r.length < cols) r.push(''); });

    const aligns = [...rows[0].children].map(c => {
      const a = (c.style.textAlign || '').toLowerCase();
      return a === 'center' ? ':---:' : a === 'right' ? '---:' : '---';
    });
    while (aligns.length < cols) aligns.push('---');

    const widths = new Array(cols).fill(3);
    grid.forEach(r => r.forEach((c, k) => { widths[k] = Math.max(widths[k], c.length); }));

    const line = cells => indent + '| ' + cells.map((c, k) => String(c).padEnd(widths[k])).join(' | ') + ' |';
    let out = line(grid[0]) + '\n';
    out += indent + '| ' + aligns.map((a, k) => {
      if (a === ':---:') return (':' + '-'.repeat(Math.max(1, widths[k] - 2)) + ':').padEnd(widths[k]);
      if (a === '---:')  return ('-'.repeat(Math.max(1, widths[k] - 1)) + ':').padEnd(widths[k]);
      return '-'.repeat(widths[k]);
    }).join(' | ') + ' |\n';
    grid.slice(1).forEach(r => { out += line(r) + '\n'; });
    return out;
  }

  function toMarkdown(root){
    return blockOf(root, '')
      .replace(/\n{3,}/g, '\n\n')
      .replace(/[ \t]+$/gm, m => m === '  ' ? m : '')
      .trim() + '\n';
  }

  return { toMarkdown };
})();


/* ================================================================
   3. DOCUMENT STATE
   ================================================================ */
const Doc = (() => {
  const els = {};
  const state = { mode:'wysiwyg', markdown:'', handle:null, name:'Untitled.md', dirty:false };

  function init(){
    els.source   = document.getElementById('source');
    els.wysiwyg  = document.getElementById('wysiwyg');
    els.preview  = document.getElementById('preview');
    els.srcPane  = document.getElementById('sourcePane');
    els.wysPane  = document.getElementById('wysiwygPane');
    els.prevPane = document.getElementById('previewPane');

    els.source.addEventListener('input', () => { touch(); if (state.mode === 'split') renderPreview(); UI.refresh(); });
    els.wysiwyg.addEventListener('input', () => { touch(); UI.refresh(); });
    els.wysiwyg.addEventListener('click', onCheckbox);
    els.preview.addEventListener('click', onCheckbox);
  }

  function onCheckbox(e){
    if (e.target.tagName === 'INPUT' && e.target.type === 'checkbox'){
      if (e.currentTarget === els.preview){
        // Preview is read-only: mirror the change into the source.
        e.preventDefault();
        const boxes = [...els.preview.querySelectorAll('input[type=checkbox]')];
        const idx = boxes.indexOf(e.target);
        let n = -1;
        state.markdown = getMarkdown().replace(/^(\s*(?:[-*+]|\d+[.)])\s+)\[([ xX])\]/gm, (m, pre, c) => {
          n++; return n === idx ? pre + '[' + (c.trim() ? ' ' : 'x') + ']' : m;
        });
        els.source.value = state.markdown;
        renderPreview(); touch(); UI.refresh();
      } else { touch(); }
    }
  }

  /** Current document text, pulled from whichever editor is authoritative. */
  function getMarkdown(){
    if (state.mode === 'wysiwyg') return Ser.toMarkdown(els.wysiwyg);
    return els.source.value;
  }

  function setMarkdown(md, opts){
    state.markdown = md;
    els.source.value = md;
    els.wysiwyg.innerHTML = MD.parse(md);
    renderPreview();
    if (opts && opts.clean) clean();
    UI.refresh();
  }

  function renderPreview(){ els.preview.innerHTML = MD.parse(els.source.value); }

  function setMode(mode){
    // Carry content across before switching authority.
    const md = getMarkdown();
    state.mode = mode;
    els.source.value = md;
    if (mode === 'wysiwyg') els.wysiwyg.innerHTML = MD.parse(md);
    else renderPreview();

    document.body.dataset.mode = mode;
    els.srcPane .classList.toggle('hidden', mode === 'wysiwyg');
    els.wysPane .classList.toggle('hidden', mode !== 'wysiwyg');
    els.prevPane.classList.toggle('hidden', mode !== 'split');

    document.getElementById('modeLabel').textContent =
      mode === 'wysiwyg' ? 'WYSIWYG' : mode === 'split' ? 'Split — source + preview' : 'Source';

    UI.refresh();
    setTimeout(() => (mode === 'wysiwyg' ? els.wysiwyg : els.source).focus(), 0);
  }

  const touch = () => { if (!state.dirty){ state.dirty = true; UI.name(); } };
  const clean = () => { state.dirty = false; UI.name(); };

  return { init, state, els, getMarkdown, setMarkdown, setMode, renderPreview, touch, clean };
})();


/* ================================================================
   4. FILES
   ================================================================ */
const Files = (() => {
  const TYPES = [{ description:'Markdown', accept:{ 'text/markdown':['.md','.markdown','.mdown','.txt'] } }];
  const canFS = () => 'showOpenFilePicker' in window;

  async function open(){
    if (!await confirmDiscard()) return;
    if (canFS()){
      try{
        const [h] = await window.showOpenFilePicker({ types:TYPES });
        const f = await h.getFile();
        Doc.state.handle = h; Doc.state.name = f.name;
        Doc.setMarkdown(await f.text(), { clean:true });
        UI.toast('Opened ' + f.name);
      }catch(e){ if (e.name !== 'AbortError') UI.toast('Could not open file'); }
    } else {
      const inp = Object.assign(document.createElement('input'), { type:'file', accept:'.md,.markdown,.txt' });
      inp.onchange = async () => {
        const f = inp.files[0]; if (!f) return;
        Doc.state.handle = null; Doc.state.name = f.name;
        Doc.setMarkdown(await f.text(), { clean:true });
        UI.toast('Opened ' + f.name + ' — use Save As to write it back');
      };
      inp.click();
    }
  }

  async function save(){
    const md = Doc.getMarkdown();
    if (Doc.state.handle){
      try{
        const w = await Doc.state.handle.createWritable();
        await w.write(md); await w.close();
        Doc.clean(); UI.toast('Saved ' + Doc.state.name);
        return true;
      }catch(e){ UI.toast('Save failed — try Save As'); return false; }
    }
    return saveAs();
  }

  async function saveAs(){
    const md = Doc.getMarkdown();
    if (canFS()){
      try{
        const h = await window.showSaveFilePicker({ suggestedName: Doc.state.name || 'document.md', types:TYPES });
        Doc.state.handle = h; Doc.state.name = h.name;
        const w = await h.createWritable(); await w.write(md); await w.close();
        Doc.clean(); UI.toast('Saved ' + h.name);
        return true;
      }catch(e){ if (e.name !== 'AbortError') UI.toast('Save failed'); return false; }
    }
    download(Doc.state.name || 'document.md', md, 'text/markdown');
    Doc.clean();
    return true;
  }

  async function newDoc(){
    if (!await confirmDiscard()) return;
    Doc.state.handle = null; Doc.state.name = 'Untitled.md';
    Doc.setMarkdown('# Untitled\n\n', { clean:true });
  }

  function exportHTML(){
    const body = MD.parse(Doc.getMarkdown());
    const title = (Doc.state.name || 'document').replace(/\.[^.]+$/, '');
    const css = `body{max-width:820px;margin:40px auto;padding:0 20px;font:16px/1.7 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#222}
h1,h2{border-bottom:1px solid #e3e3e3;padding-bottom:.3em}
code{background:#f3f4f6;padding:.15em .4em;border-radius:4px;font-size:.88em}
pre{background:#f6f8fa;padding:14px 16px;border-radius:8px;overflow-x:auto}
pre code{background:none;padding:0}
blockquote{border-left:3px solid #d0d7de;margin:1em 0;padding:.2em 1em;color:#57606a}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid #d0d7de;padding:7px 11px;text-align:left}
th{background:#f6f8fa}
img{max-width:100%}
a{color:#0969da}`;
    download(title + '.html',
      `<!DOCTYPE html>\n<html><head><meta charset="utf-8"><title>${title}</title>\n<style>${css}</style>\n</head>\n<body>\n${body}\n</body></html>`,
      'text/html');
    UI.toast('Exported HTML — open it and print to PDF if you need one');
  }

  function download(name, text, mime){
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: mime + ';charset=utf-8' }));
    a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }

  async function confirmDiscard(){
    if (!Doc.state.dirty) return true;
    return confirm('You have unsaved changes. Discard them?');
  }

  function initDrop(){
    addEventListener('dragover', e => e.preventDefault());
    addEventListener('drop', async e => {
      e.preventDefault();
      const item = e.dataTransfer.items && e.dataTransfer.items[0];
      if (canFS() && item && item.getAsFileSystemHandle){
        const h = await item.getAsFileSystemHandle();
        if (h && h.kind === 'file'){
          const f = await h.getFile();
          Doc.state.handle = h; Doc.state.name = f.name;
          Doc.setMarkdown(await f.text(), { clean:true });
          UI.toast('Opened ' + f.name);
          return;
        }
      }
      const f = e.dataTransfer.files[0];
      if (f){ Doc.state.handle = null; Doc.state.name = f.name; Doc.setMarkdown(await f.text(), { clean:true }); }
    });
  }

  return { open, save, saveAs, newDoc, exportHTML, initDrop, canFS };
})();

/* ================================================================
   FORMATTING PRIMITIVES
   Each works in both WYSIWYG (DOM) and source/split (textarea).
   ================================================================ */
const Fmt = (() => {
  const isRich = () => Doc.state.mode === 'wysiwyg';
  const ta = () => Doc.els.source;

  function sel(){
    const t = ta();
    return { start:t.selectionStart, end:t.selectionEnd, text:t.value.slice(t.selectionStart, t.selectionEnd) };
  }

  function replace(start, end, text, selStart, selEnd){
    const t = ta();
    t.setRangeText(text, start, end, 'end');
    if (selStart != null) t.setSelectionRange(selStart, selEnd == null ? selStart : selEnd);
    t.focus();
    t.dispatchEvent(new Event('input', { bubbles:true }));
  }

  function lineBounds(){
    const t = ta(), v = t.value;
    const s = v.lastIndexOf('\n', t.selectionStart - 1) + 1;
    let e = v.indexOf('\n', t.selectionEnd);
    if (e === -1) e = v.length;
    return { s, e, text:v.slice(s, e) };
  }

  function wrap(marks, execName){
    if (isRich()){ document.execCommand(execName, false, null); Doc.touch(); UI.refresh(); return; }
    const { start, end, text } = sel();
    if (text) replace(start, end, marks + text + marks, start + marks.length, end + marks.length);
    else replace(start, end, marks + marks, start + marks.length);
  }

  function inlineCode(){
    if (isRich()){
      const s = window.getSelection();
      if (!s.rangeCount) return;
      const r = s.getRangeAt(0);
      const existing = r.startContainer.parentElement && r.startContainer.parentElement.closest('code');
      if (existing){ // unwrap
        const p = existing.parentNode;
        while (existing.firstChild) p.insertBefore(existing.firstChild, existing);
        existing.remove();
      } else {
        const c = document.createElement('code');
        c.textContent = r.toString() || 'code';
        r.deleteContents(); r.insertNode(c);
        const nr = document.createRange(); nr.selectNodeContents(c);
        s.removeAllRanges(); s.addRange(nr);
      }
      Doc.touch(); UI.refresh(); return;
    }
    wrap('`');
  }

  function heading(n){
    if (isRich()){
      const cur = currentBlock();
      const same = cur && cur.tagName === 'H' + n;
      document.execCommand('formatBlock', false, same ? 'P' : 'H' + n);
      Doc.touch(); UI.refresh(); return;
    }
    const { s, e, text } = lineBounds();
    const stripped = text.replace(/^#{1,6}\s+/, '');
    const already = new RegExp('^#{' + n + '}\\s').test(text);
    const out = already ? stripped : '#'.repeat(n) + ' ' + stripped;
    replace(s, e, out, s + out.length);
  }

  function list(ordered){
    if (isRich()){
      document.execCommand(ordered ? 'insertOrderedList' : 'insertUnorderedList', false, null);
      Doc.touch(); UI.refresh(); return;
    }
    const { s, e, text } = lineBounds();
    const out = text.split('\n').map((l, i) => {
      const bare = l.replace(/^\s*(?:[-*+]|\d+[.)])\s+/, '');
      return ordered ? `${i + 1}. ${bare}` : `- ${bare}`;
    }).join('\n');
    replace(s, e, out, s + out.length);
  }

  function task(){
    if (isRich()){
      const li = currentBlock('LI');
      if (li && !li.querySelector(':scope > input[type=checkbox]')){
        const box = document.createElement('input');
        box.type = 'checkbox'; li.classList.add('task');
        li.insertBefore(box, li.firstChild);
      } else if (!li){
        document.execCommand('insertUnorderedList', false, null);
        const nli = currentBlock('LI');
        if (nli){
          const box = document.createElement('input');
          box.type = 'checkbox'; nli.classList.add('task');
          nli.insertBefore(box, nli.firstChild);
        }
      }
      Doc.touch(); UI.refresh(); return;
    }
    const { s, e, text } = lineBounds();
    const out = text.split('\n').map(l => {
      const bare = l.replace(/^\s*(?:[-*+]|\d+[.)])\s+/, '').replace(/^\[[ xX]\]\s*/, '');
      return `- [ ] ${bare}`;
    }).join('\n');
    replace(s, e, out, s + out.length);
  }

  function quote(){
    if (isRich()){
      const bq = currentBlock('BLOCKQUOTE');
      document.execCommand('formatBlock', false, bq ? 'P' : 'BLOCKQUOTE');
      Doc.touch(); UI.refresh(); return;
    }
    const { s, e, text } = lineBounds();
    const on = text.split('\n').every(l => /^\s*>/.test(l));
    const out = text.split('\n').map(l => on ? l.replace(/^\s*>\s?/, '') : '> ' + l).join('\n');
    replace(s, e, out, s + out.length);
  }

  function codeBlock(){
    if (isRich()){
      const s = window.getSelection();
      const txt = s.toString() || '';
      const pre = document.createElement('pre');
      const code = document.createElement('code');
      code.textContent = txt || 'code here';
      pre.appendChild(code);
      if (s.rangeCount){ const r = s.getRangeAt(0); r.deleteContents(); r.insertNode(pre); }
      else Doc.els.wysiwyg.appendChild(pre);
      Doc.touch(); UI.refresh(); return;
    }
    const { start, end, text } = sel();
    const body = text || 'code here';
    const out = '```\n' + body + '\n```\n';
    replace(start, end, out, start + 4, start + 4 + body.length);
  }

  function hr(){
    if (isRich()){ document.execCommand('insertHTML', false, '<hr><p><br></p>'); Doc.touch(); UI.refresh(); return; }
    const { start, end } = sel();
    replace(start, end, '\n---\n\n');
  }

  function link(){
    const dlg = document.getElementById('linkDlg');
    const selText = isRich() ? String(window.getSelection()) : sel().text;
    const savedRange = isRich() && window.getSelection().rangeCount ? window.getSelection().getRangeAt(0).cloneRange() : null;
    document.getElementById('linkText').value = selText || '';
    document.getElementById('linkUrl').value = '';
    dlg.returnValue = '';
    dlg.showModal();
    document.getElementById('linkUrl').focus();
    dlg.addEventListener('close', function once(){
      dlg.removeEventListener('close', once);
      if (dlg.returnValue !== 'ok') return;
      const text = document.getElementById('linkText').value || document.getElementById('linkUrl').value;
      const url  = document.getElementById('linkUrl').value;
      if (!url) return;
      if (isRich()){
        Doc.els.wysiwyg.focus();
        if (savedRange){ const s = window.getSelection(); s.removeAllRanges(); s.addRange(savedRange); }
        document.execCommand('insertHTML', false, `<a href="${url.replace(/"/g,'&quot;')}">${text}</a>`);
      } else {
        const { start, end } = sel();
        replace(start, end, `[${text}](${url})`);
      }
      Doc.touch(); UI.refresh();
    });
  }

  function image(){
    const dlg = document.getElementById('imgDlg');
    const savedRange = saveRange();
    document.getElementById('imgAlt').value = '';
    document.getElementById('imgUrl').value = '';
    dlg.returnValue = '';
    dlg.showModal();
    dlg.addEventListener('close', function once(){
      dlg.removeEventListener('close', once);
      if (dlg.returnValue !== 'ok') return;
      const alt = document.getElementById('imgAlt').value;
      const url = document.getElementById('imgUrl').value;
      if (!url) return;
      if (isRich()){
        restoreRange(savedRange);
        insertHTMLBlock(`<img src="${url.replace(/"/g,'&quot;')}" alt="${alt.replace(/"/g,'&quot;')}">`);
      } else {
        const { start, end } = sel();
        replace(start, end, `![${alt}](${url})`);
      }
      Doc.touch(); UI.refresh();
    });
  }

  /** Nearest block element containing the caret inside the WYSIWYG editor. */
  function currentBlock(tag){
    const s = window.getSelection();
    if (!s.rangeCount) return null;
    let n = s.getRangeAt(0).startContainer;
    if (n.nodeType === 3) n = n.parentElement;
    if (!Doc.els.wysiwyg.contains(n)) return null;
    if (tag) return n.closest(tag);
    while (n && n !== Doc.els.wysiwyg && !/^(P|DIV|H[1-6]|LI|PRE|BLOCKQUOTE|TD|TH)$/.test(n.tagName)) n = n.parentElement;
    return n === Doc.els.wysiwyg ? null : n;
  }

  function insertHTMLBlock(html){
    if (isRich()){
      Doc.els.wysiwyg.focus();
      const s = window.getSelection();
      const inside = s.rangeCount && Doc.els.wysiwyg.contains(s.getRangeAt(0).commonAncestorContainer);
      if (!inside){
        // No usable caret (e.g. it was lost to a modal) — append at the end.
        const r = document.createRange();
        r.selectNodeContents(Doc.els.wysiwyg);
        r.collapse(false);
        s.removeAllRanges(); s.addRange(r);
      }
      document.execCommand('insertHTML', false, html);
    }
    Doc.touch(); UI.refresh();
  }

  /** Remember / restore the caret across a modal dialog. */
  function saveRange(){
    if (!isRich()) return null;
    const s = window.getSelection();
    if (!s.rangeCount) return null;
    const r = s.getRangeAt(0);
    return Doc.els.wysiwyg.contains(r.commonAncestorContainer) ? r.cloneRange() : null;
  }
  function restoreRange(r){
    if (!r || !isRich()) return;
    Doc.els.wysiwyg.focus();
    const s = window.getSelection();
    s.removeAllRanges(); s.addRange(r);
  }

  return { wrap, inlineCode, heading, list, task, quote, codeBlock, hr, link, image, currentBlock,
           insertHTMLBlock, saveRange, restoreRange, sel, replace, isRich };
})();


/* ================================================================
   6. TABLES
   ================================================================ */
const Tables = (() => {
  const dlg = () => document.getElementById('tableDlg');
  let savedRange = null;   // caret position captured before the modal steals focus

  function buildGrid(){
    const rows = Math.max(1, +document.getElementById('tRows').value || 1);
    const cols = Math.max(1, +document.getElementById('tCols').value || 1);
    let html = '<table>';
    for (let r = 0; r <= rows; r++){
      html += '<tr>';
      for (let c = 0; c < cols; c++){
        html += `<td><input type="text" data-r="${r}" data-c="${c}" placeholder="${r === 0 ? 'Header ' + (c+1) : ''}"></td>`;
      }
      html += '</tr>';
    }
    document.getElementById('gridWrap').innerHTML = html + '</table>';
  }

  function dialog(){
    savedRange = Fmt.saveRange();
    buildGrid();
    dlg().showModal();
    setTimeout(() => { const f = dlg().querySelector('#gridWrap input'); if (f) f.focus(); }, 30);
  }

  function collect(){
    const cells = [...dlg().querySelectorAll('#gridWrap input')];
    const rows = Math.max(...cells.map(i => +i.dataset.r)) + 1;
    const cols = Math.max(...cells.map(i => +i.dataset.c)) + 1;
    const grid = Array.from({ length:rows }, () => Array(cols).fill(''));
    cells.forEach(i => { grid[+i.dataset.r][+i.dataset.c] = i.value.trim(); });
    grid[0] = grid[0].map((v, i) => v || 'Column ' + (i + 1));
    return grid;
  }

  function insert(){
    const grid = collect();
    const align = document.getElementById('tAlign').value;
    const bar = align === 'center' ? ':---:' : align === 'right' ? '---:' : '---';
    const w = grid[0].map((_, c) => Math.max(3, ...grid.map(r => (r[c] || '').length)));
    const line = cells => '| ' + cells.map((c, i) => String(c || '').padEnd(w[i])).join(' | ') + ' |';
    let md = line(grid[0]) + '\n' + '| ' + w.map(x => bar.padEnd(x, bar.endsWith(':') ? '-' : '-')).join(' | ') + ' |\n';
    grid.slice(1).forEach(r => { md += line(r) + '\n'; });

    // Close first: execCommand cannot run while a modal dialog holds focus.
    dlg().close();
    setTimeout(() => {
      if (Fmt.isRich()){
        Fmt.restoreRange(savedRange);
        Fmt.insertHTMLBlock(MD.parse(md) + '<p><br></p>');
      } else {
        Doc.els.source.focus();
        const { start, end } = Fmt.sel();
        Fmt.replace(start, end, '\n' + md + '\n');
      }
      savedRange = null;
    }, 0);
  }

  /* --- live row/column editing inside the WYSIWYG view --- */
  let active = null;
  const bar = () => document.getElementById('tableBar');

  function track(){
    const cell = Fmt.isRich() ? Fmt.currentBlock('td,th') : null;
    const table = cell ? cell.closest('table') : null;
    document.querySelectorAll('#wysiwyg table.sel').forEach(t => t.classList.remove('sel'));
    if (!table){ bar().classList.remove('show'); active = null; return; }
    active = { table, cell };
    table.classList.add('sel');
    const r = table.getBoundingClientRect();
    const b = bar();
    b.classList.add('show');
    b.style.left = Math.round(r.left) + 'px';
    b.style.top  = Math.round(Math.max(46, r.top - 40)) + 'px';
  }

  function op(kind){
    if (!active) return;
    const { table, cell } = active;
    const tr = cell.closest('tr');
    const idx = [...tr.children].indexOf(cell);
    const body = table.querySelector('tbody') || table;
    const mk = () => { const td = document.createElement('td'); td.innerHTML = '<br>'; return td; };

    if (kind === 'rowAbove' || kind === 'rowBelow'){
      if (tr.parentElement.tagName === 'THEAD' && kind === 'rowAbove') return;
      const row = document.createElement('tr');
      [...tr.children].forEach(() => row.appendChild(mk()));
      if (tr.parentElement.tagName === 'THEAD') body.insertBefore(row, body.firstChild);
      else tr.parentElement.insertBefore(row, kind === 'rowAbove' ? tr : tr.nextSibling);
    }
    if (kind === 'colLeft' || kind === 'colRight'){
      [...table.querySelectorAll('tr')].forEach(row => {
        const head = row.parentElement.tagName === 'THEAD';
        const c = head ? document.createElement('th') : mk();
        if (head) c.textContent = 'Column';
        const ref = row.children[idx];
        row.insertBefore(c, kind === 'colLeft' ? ref : (ref ? ref.nextSibling : null));
      });
    }
    if (kind === 'delRow'){
      if (tr.parentElement.tagName === 'THEAD'){ UI.toast('The header row cannot be deleted'); return; }
      tr.remove();
    }
    if (kind === 'delCol'){
      if (table.querySelectorAll('thead th').length <= 1){ UI.toast('A table needs at least one column'); return; }
      [...table.querySelectorAll('tr')].forEach(row => { if (row.children[idx]) row.children[idx].remove(); });
    }
    Doc.touch(); UI.refresh(); track();
  }

  function init(){
    document.getElementById('tInsert').onclick = insert;
    document.getElementById('tCancel').onclick = () => dlg().close();
    document.getElementById('tRows').oninput = buildGrid;
    document.getElementById('tCols').oninput = buildGrid;
    bar().addEventListener('mousedown', e => {
      const b = e.target.closest('button'); if (!b) return;
      e.preventDefault(); op(b.dataset.t);
    });
    document.addEventListener('selectionchange', () => { if (Fmt.isRich()) track(); });
    // Tab / Enter navigation inside the insert dialog grid.
    document.getElementById('gridWrap').addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      const inp = e.target;
      const next = dlg().querySelector(`#gridWrap input[data-r="${+inp.dataset.r + 1}"][data-c="${inp.dataset.c}"]`);
      if (next) next.focus();
    });
  }

  return { dialog, init };
})();


/* ================================================================
   7. UI WIRING
   ================================================================ */
const UI = (() => {

  function buildToolbar(){
    const map = { file:'fileGroup', format:'formatGroup', block:'blockGroup', insert:'insertGroup', view:'viewGroup' };
    Commands.forEach(c => {
      const host = document.getElementById(map[c.group]);
      if (!host) return;
      const b = document.createElement('button');
      b.className = 'tb' + (c.group === 'file' ? ' primary' : '');
      b.id = 'cmd-' + c.id;
      b.title = c.title || c.label;
      b.innerHTML = c.html || c.label;
      b.onclick = () => c.run();
      host.appendChild(b);
    });
  }

  function normKey(e){
    let k = '';
    if (e.ctrlKey || e.metaKey) k += 'ctrl+';
    if (e.shiftKey) k += 'shift+';
    if (e.altKey) k += 'alt+';
    return k + e.key.toLowerCase();
  }

  function initKeys(){
    addEventListener('keydown', e => {
      const k = normKey(e);
      const cmd = Commands.find(c => c.key === k);
      if (cmd){ e.preventDefault(); cmd.run(); return; }
      // Tab inside the source editor inserts two spaces rather than moving focus.
      if (e.key === 'Tab' && e.target === Doc.els.source){
        e.preventDefault();
        const { start, end } = Fmt.sel();
        Fmt.replace(start, end, '  ', start + 2);
      }
    });
  }

  function name(){
    document.getElementById('docName').innerHTML =
      (Doc.state.dirty ? '<span class="dirty">● </span>' : '') + Doc.state.name;
  }

  function outline(){
    const list = document.getElementById('outlineList');
    const src = Doc.getMarkdown();
    const items = [];
    let inFence = false;
    src.split('\n').forEach(l => {
      if (/^\s*(```|~~~)/.test(l)){ inFence = !inFence; return; }
      if (inFence) return;
      const m = /^(#{1,6})\s+(.*?)\s*#*$/.exec(l);
      if (m) items.push({ lv:m[1].length, text:m[2].replace(/[*_`\[\]]/g, '') });
    });
    if (!items.length){ list.innerHTML = '<div class="empty">No headings yet</div>'; return; }
    list.innerHTML = items.map((h, i) =>
      `<a class="lv${h.lv}" data-i="${i}" title="${h.text.replace(/"/g,'&quot;')}">${h.text}</a>`).join('');
    [...list.children].forEach(a => { a.onclick = () => jump(+a.dataset.i); });
  }

  function jump(index){
    if (Doc.state.mode === 'wysiwyg'){
      const hs = Doc.els.wysiwyg.querySelectorAll('h1,h2,h3,h4,h5,h6');
      if (hs[index]) hs[index].scrollIntoView({ behavior:'smooth', block:'start' });
    } else {
      const hs = Doc.els.preview.querySelectorAll('h1,h2,h3,h4,h5,h6');
      if (Doc.state.mode === 'split' && hs[index]) hs[index].scrollIntoView({ behavior:'smooth', block:'start' });
      const lines = Doc.els.source.value.split('\n');
      let n = -1;
      for (let i = 0; i < lines.length; i++){
        if (/^#{1,6}\s+/.test(lines[i]) && ++n === index){
          const pos = lines.slice(0, i).join('\n').length;
          Doc.els.source.focus();
          Doc.els.source.setSelectionRange(pos, pos);
          const ratio = i / Math.max(1, lines.length);
          Doc.els.source.scrollTop = ratio * Doc.els.source.scrollHeight;
          break;
        }
      }
    }
  }

  function counts(){
    const md = Doc.getMarkdown();
    const words = (md.replace(/```[\s\S]*?```/g, ' ').match(/[A-Za-zÀ-ÿ0-9'’_-]+/g) || []).length;
    const read = Math.max(1, Math.round(words / 220));
    document.getElementById('counts').textContent =
      `${words.toLocaleString()} words · ${md.length.toLocaleString()} chars · ~${read} min read`;
  }

  let raf = 0;
  function refresh(){
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => { outline(); counts(); name(); });
  }

  function theme(){
    const el = document.documentElement;
    el.dataset.theme = el.dataset.theme === 'dark' ? 'light' : 'dark';
  }

  let toastT = 0;
  function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastT);
    toastT = setTimeout(() => t.classList.remove('show'), 2400);
  }

  function help(){
    const rows = Commands.filter(c => c.key).map(c =>
      `<tr><td style="padding:4px 14px 4px 0"><kbd>${c.key.replace(/\+/g,'</kbd>+<kbd>')}</kbd></td>
           <td style="padding:4px 0;color:var(--fg-dim)">${(c.title || c.label).replace(/\s*\([^)]*\)$/, '')}</td></tr>`).join('');
    document.getElementById('helpBody').innerHTML =
      `<table style="border-collapse:collapse;font-size:13px">${rows}</table>
       <div class="hint">In WYSIWYG mode you can also paste rich text and it converts to markdown on save.
       Drag a .md file onto the window to open it.</div>`;
    document.getElementById('helpDlg').showModal();
  }

  function init(){
    buildToolbar();
    initKeys();
    document.getElementById('helpClose').onclick = () => document.getElementById('helpDlg').close();
    addEventListener('beforeunload', e => { if (Doc.state.dirty){ e.preventDefault(); e.returnValue = ''; } });
  }

  return { init, refresh, name, toast, theme, help, outline, counts };
})();
